name: 更新資料並發布

on:
  schedule:
    # 台灣時間 週一～週五 21:40、22:40，以及隔天早上 07:40（補抓較晚公布的官方數據）
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "40 23 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "重新建立最近 N 個交易日的歷史（0 = 只補新資料）"
        required: false
        default: "0"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 一律從最新的 main 開始，避免和前一次的資料提交衝突
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取資料
        env:
          BUDGET_MIN: "95"
        run: |
          N="${{ github.event.inputs.backfill }}"
          if [ -n "$N" ] && [ "$N" != "0" ]; then
            python scripts/update.py --backfill "$N"
          else
            python scripts/update.py
          fi
      - name: 提交資料
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
